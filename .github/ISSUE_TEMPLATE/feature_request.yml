name: Feature request
description: Suggest a small, general-purpose improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Requests should keep the toolkit local-first, dependency-free, and useful beyond one private question bank.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe a small, testable change. Use synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you considered.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe-to-share check
      options:
        - label: My example contains no private, paid, licensed, unreleased, or learner-submitted content.
          required: true
