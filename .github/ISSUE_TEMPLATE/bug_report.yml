name: Bug report
description: Report a reproducible problem in the toolkit.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please use a small synthetic question bank. Do not include private, paid, licensed, unreleased, or learner-submitted content.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result and what you expected instead.
      placeholder: A synthetic bank with a valid answer index was reported as invalid.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command and a minimal synthetic input shape, not real question text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Toolkit and Node.js versions
      placeholder: toolkit 0.2.0; Node.js 22.x
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe-to-share check
      options:
        - label: This report uses synthetic or clearly redistributable examples and contains no private question text or personal data.
          required: true
